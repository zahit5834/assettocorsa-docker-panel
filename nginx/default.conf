server {
    listen 80;
    server_name _;

    # Büyük harita, araba ve pack arşiv yüklemeleri için sınırsız boyut
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    root /usr/share/nginx/html;
    index index.html;

    # Backend X-Accel-Redirect üzerinden yüksek hızlı mod / pack indirme
    location /internal-data/ {
        internal;
        alias /data/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=3600";
    }

    # Canlı konsol logları (WebSocket)
    location /api/ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # REST API ve büyük dosya yüklemeleri (buffering kapalı = düşük RAM kullanımı)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA (Admin Paneli + /join/:slug Oyuncu Davet Portalı)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
